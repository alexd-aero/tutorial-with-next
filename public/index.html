<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scramjet Proxy</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- Registers the Scramjet service worker + controller ahead of time. -->
  <script src="/bootstrap-init.js"></script>
</head>
<body>
  <main class="card">
    <h1>Scramjet Proxy</h1>
    <p class="sub">Enter a URL. It loads through Scramjet at <code>/go/&lt;base64url&gt;</code>.</p>
    <form id="f">
      <input id="u" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://example.com" />
      <button type="submit">Go</button>
    </form>
    <p id="status" class="status"></p>
  </main>
  <script src="/index.js"></script>
</body>
</html>
